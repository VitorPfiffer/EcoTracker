trigger:
  branches:
    include:
      - main

variables:
  buildConfiguration: "Release"
  imageName: "ecotracker-api"

stages:
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: Build
        displayName: "Build and Test"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: "sdk"
              version: "8.0.x"

          - script: |
              dotnet restore EcoTracker.sln
              dotnet build EcoTracker.sln --configuration $(buildConfiguration)
              dotnet test EcoTracker.sln --configuration $(buildConfiguration)
            displayName: "Restore, Build and Test"

          - task: Docker@2
            displayName: "Build Docker Image"
            inputs:
              command: "buildAndPush"
              repository: "mydockerhubuser/$(imageName)"
              dockerfile: "EcoTracker.API/Dockerfile"
              containerRegistry: "MyDockerRegistryServiceConnection"
              tags: |
                $(Build.BuildId)
