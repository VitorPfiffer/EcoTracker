name: Build and deploy a container to an Azure Web App

env:
  AZURE_WEBAPP_NAME: EcoTracker  # seu Web App Linux
  DOCKER_REGISTRY_SERVER_URL: ghcr.io
  DOCKER_REGISTRY_SERVER_USERNAME: ${{ github.actor }}
  DOCKER_REGISTRY_SERVER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY_SERVER_URL }}
          username: ${{ env.DOCKER_REGISTRY_SERVER_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_SERVER_PASSWORD }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        context: ./EcoTracker
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.DOCKER_REGISTRY_SERVER_URL }}/${{ env.REPO }}:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Deploy to Azure Web App (Linux)
        uses: azure/webapps-container-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.DOCKER_REGISTRY_SERVER_URL }}/${{ env.REPO }}:${{ github.sha }}
          registry-url: ${{ env.DOCKER_REGISTRY_SERVER_URL }}
          registry-username: ${{ env.DOCKER_REGISTRY_SERVER_USERNAME }}
          registry-password: ${{ env.DOCKER_REGISTRY_SERVER_PASSWORD }}
