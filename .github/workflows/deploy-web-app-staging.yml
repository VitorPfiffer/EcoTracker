name: Staging - Deploy Azure Web App

env:
  AZURE_WEBAPP_NAME: EcoTracker # seu Web App Linux
  DOCKER_REGISTRY_SERVER_URL: ghcr.io
  DOCKER_REGISTRY_SERVER_USERNAME: ${{ github.actor }}
  DOCKER_REGISTRY_SERVER_PASSWORD: ${{ secrets.GHCR_PAT }}

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY_SERVER_URL }}
          username: ${{ env.DOCKER_REGISTRY_SERVER_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_SERVER_PASSWORD }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v5
        with:
          context: ./EcoTracker
          push: true
          tags: ${{ env.DOCKER_REGISTRY_SERVER_URL }}/${{ env.REPO }}:staging
          file: ./Dockerfile
